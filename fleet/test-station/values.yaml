global:
  publicScheme: https
  publicDomain: ""

image:
  repository: ghcr.io/smysnk/test-station
  tag: main
  pullPolicy: Always
  pullSecrets: []

server:
  replicaCount: 2
  args:
    - server
  existingConfigMap: ""
  existingSecret: ""
  service:
    type: ClusterIP
    port: 4400
    nodePort: null
  ingressPaths:
    - path: /api/ingest
      pathType: Prefix
  config:
    NODE_ENV: production
    SERVER_PORT: "4400"
    SERVER_JSON_LIMIT: "50mb"
    INGEST_JSON_LIMIT: "50mb"
    SERVER_ROLE: read
    WEB_URL: ""
  secret:
    DATABASE_URL: postgres://test-station:change-me@postgresql.default.svc.cluster.local:5432/test_station
    INGEST_SHARED_KEY: change-me
  podAnnotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  livenessProbe:
    path: /healthz
    initialDelaySeconds: 20
    periodSeconds: 20
  readinessProbe:
    path: /readyz
    initialDelaySeconds: 10
    periodSeconds: 10

ingest:
  replicaCount: 1
  args:
    - server
  service:
    type: ClusterIP
    port: 4400
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  livenessProbe:
    path: /healthz
    initialDelaySeconds: 20
    periodSeconds: 20
  readinessProbe:
    path: /readyz
    initialDelaySeconds: 10
    periodSeconds: 10

migrations:
  enabled: true
  backoffLimit: 3

web:
  replicaCount: 2
  args:
    - web
  existingConfigMap: ""
  existingSecret: ""
  service:
    type: NodePort
    port: 3001
    nodePort: null
  config:
    NODE_ENV: production
    WEB_PORT: "3001"
    WEB_GRAPHQL_PATH: /graphql
    GA_MEASUREMENT_ID: ""
    SERVER_URL: ""
    NEXTAUTH_URL: ""
    WEB_DEMO_AUTH_ENABLED: "false"
    WEB_DEFAULT_PROJECT_KEYS: "*"
    WEB_ADMIN_EMAILS: ""
  secret:
    NEXTAUTH_SECRET: change-me
    GITHUB_CLIENT_ID: ""
    GITHUB_CLIENT_SECRET: ""
    GOOGLE_CLIENT_ID: ""
    GOOGLE_CLIENT_SECRET: ""
    DISCORD_CLIENT_ID: ""
    DISCORD_CLIENT_SECRET: ""
  podAnnotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  livenessProbe:
    path: /api/healthz
    initialDelaySeconds: 30
    periodSeconds: 20
  readinessProbe:
    path: /api/readyz
    initialDelaySeconds: 10
    periodSeconds: 10
  ingress:
    enabled: false
    className: ""
    annotations: {}
    requestBodyLimit:
      enabled: true
      maxRequestBodyBytes: 52428800
    host: ""
    paths:
      - path: /api/auth
        pathType: Prefix
      - path: /api/healthz
        pathType: Prefix
      - path: /api/readyz
        pathType: Prefix
      - path: /api/metrics
        pathType: Prefix
      - path: /api/badges
        pathType: Prefix
      - path: /api/graphql-proxy
        pathType: Prefix
      - path: /api/runs
        pathType: Prefix
      - path: /
        pathType: Prefix
    path: /
    pathType: Prefix
    hosts: []
    tls:
      enabled: false
      secretName: ""
      hosts: []
